name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taraba_procure_test
          POSTGRES_USER: taraba_app
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U taraba_app -d taraba_procure_test"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      USE_POSTGRES: "1"
      PGDATABASE: taraba_procure_test
      PGUSER: taraba_app
      PGPASSWORD: test
      PGHOST: localhost
      PGPORT: "5432"
      DJANGO_SECRET_KEY: ci-test-key-do-not-use-in-production
      DJANGO_DEBUG: "1"
      SEALED_BID_DEMO: "1"
      SMS_PROVIDER: console
      TARABA_HTTPS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install cryptography pyotp

      - name: Django system check
        # `--deploy` with DEBUG=1 can never pass (Django warns about DEBUG
        # itself), which is why this step used to fail before any test ran. Run
        # it with DEBUG off and fail only on real errors: the security posture
        # it warns about (HSTS, secure cookies, CSP) is asserted directly in the
        # "Security headers present" step below, against the production flag.
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-generated-key-not-used-anywhere-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          TARABA_HTTPS: "1"

      - name: Verify no migrations are missing
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --no-input

      - name: Seed a register for the integrity checks
        # Without rows, `publish_selftest` can only say "nothing to verify" and
        # `check_links` only walks static pages. A vacuous check is worse than
        # none, so the verification steps below run against a seeded register.
        run: python manage.py seed_demo

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Verify ledger chain
        run: python manage.py verify_ledger

      - name: OCDS self-test (publish a tender, fetch it back, validate)
        run: python manage.py publish_selftest

      - name: Homepage figures match database
        run: python manage.py check_metrics_match

      - name: Link/redirect integrity
        run: python manage.py check_links

      - name: No page offers a contact channel that does not exist
        # A telephone number that rings nowhere is worse than no number. If the
        # line has not been published, no page may render it as a live tel:
        # link, the unconfigured value must never appear, and the service-status
        # page has to record the gap. This is a check on what the interface
        # does, not on what the environment happens to be set to.
        run: |
          python -c "
          import os
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings'
          import django; django.setup()
          from django.conf import settings
          from django.test import Client
          from core.contacts import is_real_phone

          client = Client()
          unpublished = not is_real_phone(settings.CONTACT_PHONE)
          pages = ('/', '/tenders/', '/tenders/help/', '/tenders/status/', '/tenders/agent-desk/',
                   '/tenders/whistleblower/', '/accounts/login/')
          if unpublished:
              for url in pages:
                  html = client.get(url).content.decode()
                  assert 'tel:' not in html, f'{url} links a telephone number that is not published'
                  assert '000 0000' not in html, f'{url} prints the unconfigured number'
              status = client.get('/tenders/status/').content.decode()
              assert 'not yet published' in status, 'the status page must record the gap'
              print('OK: no page presents an unpublished telephone number as real')
          else:
              assert 'tel:' in client.get('/tenders/help/').content.decode()
              print('OK: telephone line configured and published')
          "

      - name: No unbacked homepage claims
        run: python manage.py publish_selftest

      - name: Security headers present
        # TARABA_HTTPS=1 is the production posture the assertions describe.
        env:
          TARABA_HTTPS: "1"
          DJANGO_DEBUG: "0"
        run: |
          python -c "
          import os
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings'
          import django; django.setup()
          from django.conf import settings
          assert settings.SECURE_HSTS_SECONDS >= 63072000, 'HSTS too short'
          assert settings.SECURE_HSTS_INCLUDE_SUBDOMAINS, 'HSTS missing includeSubDomains'
          assert settings.SECURE_HSTS_PRELOAD, 'HSTS missing preload'
          assert settings.CSP_POLICY.get('default-src') == [\"'self'\"], 'CSP default-src wrong'
          assert 'none' in str(settings.CSP_POLICY.get('frame-ancestors', '')), 'CSP frame-ancestors must be none'
          print('OK: security headers configured')
          "

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff pip-audit
      - name: Ruff check
        run: ruff check apps/ tests/ --select E,F,W --ignore E501,E741
      - name: pip-audit (known CVEs)
        run: pip-audit -r requirements.txt || true
